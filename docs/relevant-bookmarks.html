<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTRY | COMPUTER STUFF BOOKMARKS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --matrix-green: #00ff41;
      --citizen-blue: #00d2ff;
      --bg-dark: #020617;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--matrix-green);
      font-family: 'Fira Code', monospace;
      min-height: 100vh;
      position: relative;
      padding: 32px;
    }

    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      opacity: 0.2;
    }

    .bookmarks-shell {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--citizen-blue);
      padding: 15px 22px;
      border-radius: 99px;
      background: rgba(0, 210, 255, 0.05);
      color: var(--citizen-blue);
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-title {
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.95rem;
    }

    .home-btn {
      color: var(--citizen-blue);
      text-decoration: none;
      padding: 8px 12px;
      border: 1px solid var(--citizen-blue);
      border-radius: 6px;
      background: rgba(0, 210, 255, 0.12);
      font-size: 0.85rem;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .home-btn:hover {
      background: var(--citizen-blue);
      color: var(--bg-dark);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
    }

    .panel {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(0, 255, 65, 0.2);
      border-radius: 12px;
      padding: 24px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.05);
    }

    .panel-title {
      color: var(--citizen-blue);
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 1rem;
      margin-bottom: 14px;
    }

    .link-list {
      list-style: none;
      display: grid;
      gap: 10px;
      max-height: 72vh;
      overflow-y: auto;
      padding-right: 6px;
    }

    .quick-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--citizen-blue);
      text-decoration: none;
      padding: 10px 12px;
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(0, 210, 255, 0.12), rgba(0, 210, 255, 0.04));
      transition: all 0.25s ease, transform 0.2s ease;
      font-size: 0.92rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .quick-link:hover {
      background: rgba(0, 210, 255, 0.2);
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.3);
      color: #e6fbff;
      transform: translateY(-1px);
    }

    .status {
      font-size: 0.9rem;
      opacity: 0.9;
      padding: 6px 2px;
    }

    @media (max-width: 768px) {
      body { padding: 18px; }
      .panel { padding: 16px; }
      .header-title { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <div class="bookmarks-shell">
    <div class="hud-header">
      <div class="header-title"><i class="fas fa-bookmark"></i> SENTRY // Computer Stuff Bookmarks</div>
      <a href="../admin.html" class="home-btn"><i class="fas fa-arrow-left"></i> Back to Admin</a>
    </div>

    <div class="panel">
      <h1 class="panel-title">Computer Stuff</h1>
      <div id="status" class="status">Loading bookmarks...</div>
      <ul id="links" class="link-list" hidden></ul>
    </div>
  </div>

  <script>
    // Matrix Rain Effect (same visual language as admin page)
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ日月火水木金土ABCDEF".split("");
    const fontSize = 14;
    let columns = canvas.width / fontSize;
    let drops = Array(Math.floor(columns)).fill(1);

    window.addEventListener('resize', () => {
      columns = canvas.width / fontSize;
      drops = Array(Math.floor(columns)).fill(1);
    });

    function draw() {
      ctx.fillStyle = 'rgba(2, 6, 23, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    setInterval(draw, 33);

    async function loadComputerStuffLinks() {
      const status = document.getElementById('status');
      const linksList = document.getElementById('links');

      try {
        const response = await fetch('./bookmarks_7_4_26.html');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const html = await response.text();
        const parser = new DOMParser();
        const bookmarksDoc = parser.parseFromString(html, 'text/html');

        const folderHeader = Array.from(bookmarksDoc.querySelectorAll('h3')).find(
          (h3) => h3.textContent.trim().toLowerCase() === 'computer stuff'
        );

        if (!folderHeader) throw new Error('Computer Stuff folder not found in bookmarks_7_4_26.html');

        const folderSibling = folderHeader.nextElementSibling;
        const folderList =
          folderSibling?.tagName === 'DL'
            ? folderSibling
            : folderSibling?.tagName === 'DD'
              ? folderSibling.querySelector(':scope > dl') || folderSibling.querySelector('dl')
              : null;

        if (!folderList || folderList.tagName !== 'DL') {
          throw new Error('Computer Stuff list structure is invalid');
        }

        const sourceLinks = Array.from(folderList.querySelectorAll('a')).filter(
          (a) => a.closest('dl') === folderList
        );

        sourceLinks.sort((a, b) => {
          const aText = (a.textContent || '').trim().toLowerCase();
          const bText = (b.textContent || '').trim().toLowerCase();
          return aText.localeCompare(bText, undefined, { numeric: true, sensitivity: 'base' });
        });

        if (!sourceLinks.length) throw new Error('No links found under Computer Stuff');

        const fragment = document.createDocumentFragment();
        sourceLinks.forEach((sourceLink) => {
          const href = sourceLink.getAttribute('href');
          if (!href) return;

          const li = document.createElement('li');
          const link = document.createElement('a');
          link.className = 'quick-link';
          link.href = href;
          link.target = '_blank';
          link.rel = 'noopener';
          link.innerHTML = `<i class="fas fa-link"></i> ${sourceLink.textContent.trim() || href}`;
          li.appendChild(link);
          fragment.appendChild(li);
        });

        linksList.appendChild(fragment);
        linksList.hidden = false;
        status.textContent = `${linksList.children.length} links loaded.`;
      } catch (error) {
        status.textContent = 'Unable to load Computer Stuff bookmarks.';
      }
    }

    loadComputerStuffLinks();
  </script>
</body>
</html>
